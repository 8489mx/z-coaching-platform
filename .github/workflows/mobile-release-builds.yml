name: Z Coaching Mobile Apps Build (Android & iOS)

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Target to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - ios
  push:
    tags:
      - 'v*'

jobs:
  # ==========================================
  # ANDROID BUILD JOB (APK & Google Play AAB)
  # ==========================================
  build-android:
    name: Build Android (APK & AAB for Google Play)
    if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'android' || github.event_name == 'push' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd mobile_app
          flutter pub get

      - name: Generate App Launcher Icons & Native Splash Screen
        run: |
          cd mobile_app
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Run Dart & Flutter Automated Tests
        run: |
          cd mobile_app
          flutter test

      - name: Build Android Release APK (Direct Install / Test)
        run: |
          cd mobile_app
          flutter build apk --release

      - name: Build Android App Bundle (AAB for Google Play Console)
        run: |
          cd mobile_app
          flutter build appbundle --release

      - name: Upload Android Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: z-coaching-android-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Android Google Play AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: z-coaching-google-play-aab
          path: mobile_app/build/app/outputs/bundle/release/app-release.aab

  # ==========================================
  # APPLE IOS BUILD JOB (IPA for App Store Connect)
  # ==========================================
  build-ios:
    name: Build Apple iOS (IPA for App Store Connect)
    if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'ios' || github.event_name == 'push' }}
    runs-on: macos-14

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd mobile_app
          flutter pub get

      - name: Generate App Launcher Icons & Native Splash Screen
        run: |
          cd mobile_app
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Build iOS Release (Unsigned IPA Payload)
        run: |
          cd mobile_app
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r ZCoaching_iOS_Release.ipa Payload
        shell: bash

      - name: Upload iOS Release IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: z-coaching-apple-ios-ipa
          path: mobile_app/build/ios/iphoneos/ZCoaching_iOS_Release.ipa
