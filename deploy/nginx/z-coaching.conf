# Nginx Configuration for Z Coaching Platform on Hostinger VPS (Ubuntu)
# Replace 'zakaria.fit' with your actual production domain

server {
    listen 80;
    listen [::]:80;
    server_name zakaria.fit www.zakaria.fit;

    # Automatic redirection to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zakaria.fit www.zakaria.fit;

    # SSL Certificates (managed via Certbot / Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/zakaria.fit/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/zakaria.fit/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Maximum file upload size (Progress photos, intake labs)
    client_max_body_size 50M;

    # Gzip Compression for high-speed client delivery
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/xml application/json image/svg+xml;

    # Root for static frontend build
    root /var/www/z-coaching/frontend/dist;
    index index.html;

    # Static uploads (Protected progress photos & assets)
    location /uploads/ {
        alias /var/www/z-coaching/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # API Backend Reverse Proxy (Node.js / Express on PM2)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }

    # Frontend Single Page Application (SPA) fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (Vite hashed bundles)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
