<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Z Coaching Dashboard</title>
    <link rel="shortcut icon" href="/assets/images/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Tajawal:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- Theme CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.17.0/tabler-icons.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/admin-dashboard_data/slick.css" rel="stylesheet">
    <link href="/admin-dashboard_data/slick-theme.css" rel="stylesheet">
    <link href="/admin-dashboard_data/animate.css" rel="stylesheet">
    <link href="/admin-dashboard_data/simplebar.css" rel="stylesheet">
    <link href="/admin-dashboard_data/bootstrap.css" rel="stylesheet">
    <link href="/admin-dashboard_data/style.css" rel="stylesheet">
  </head>
  <body data-bs-theme="light" data-sidebar-theme="light" data-bs-sidebar="full">
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister();
            console.log('ServiceWorker unregistered');
          }
        });
      }
      
      window.addEventListener('error', function(e) {
        var errDiv = document.createElement('div');
        errDiv.style.position = 'fixed';
        errDiv.style.top = '0';
        errDiv.style.left = '0';
        errDiv.style.width = '100vw';
        errDiv.style.height = '100vh';
        errDiv.style.backgroundColor = 'rgba(255,0,0,0.9)';
        errDiv.style.color = 'white';
        errDiv.style.zIndex = '999999';
        errDiv.style.padding = '20px';
        errDiv.style.fontSize = '24px';
        errDiv.style.whiteSpace = 'pre-wrap';
        errDiv.innerHTML = '<h1>Javascript Error:</h1><p>' + e.message + '</p><p>' + e.filename + ':' + e.lineno + '</p>';
        document.body.appendChild(errDiv);
      });
      window.addEventListener('unhandledrejection', function(e) {
        var errDiv = document.createElement('div');
        errDiv.style.position = 'fixed';
        errDiv.style.top = '0';
        errDiv.style.left = '0';
        errDiv.style.width = '100vw';
        errDiv.style.height = '100vh';
        errDiv.style.backgroundColor = 'rgba(255,0,0,0.9)';
        errDiv.style.color = 'white';
        errDiv.style.zIndex = '999999';
        errDiv.style.padding = '20px';
        errDiv.style.fontSize = '24px';
        errDiv.style.whiteSpace = 'pre-wrap';
        errDiv.innerHTML = '<h1>Promise Rejection:</h1><p>' + e.reason + '</p>';
        document.body.appendChild(errDiv);
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
