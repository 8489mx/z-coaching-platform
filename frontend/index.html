<html lang="ar" dir="rtl">
  <head>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/jpeg" href="/admin-dashboard_data/logo/z_dumbbell_flat.jpg" />
    <link rel="shortcut icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/admin-dashboard_data/logo/z_dumbbell_flat.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <title>Z Coaching Master Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;600;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- Theme CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.17.0/tabler-icons.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/admin-dashboard_data/slick.css" rel="stylesheet">
    <link href="/admin-dashboard_data/slick-theme.css" rel="stylesheet">
    <link href="/admin-dashboard_data/animate.css" rel="stylesheet">
    <link href="/admin-dashboard_data/simplebar.css" rel="stylesheet">
    <link href="/admin-dashboard_data/bootstrap.css" rel="stylesheet">
    <link href="/admin-dashboard_data/style.css" rel="stylesheet">
        <style>
      :root {
        /* Karim Zakaria Elite Brand Tokens */
        --color-brand-bg: #FAFBFC;
        --color-brand-surface: #FFFFFF;
        --color-brand-primary: #58B4E5;
        --color-brand-primary-hover: #48A4D5;
        --color-brand-secondary: #E5F0FF;
        --color-brand-text: #0F172A;
        --color-brand-muted: #64748B;
        --color-brand-border: #E7EEF3;
        --color-brand-gold: #C4952D;
        --color-brand-green: #10B981;

        --bs-primary: #58B4E5;
        --bs-primary-rgb: 88, 180, 229;
        --bs-primary-hover: #48A4D5;
        --bs-secondary: #64748B;
        --bs-success: #10B981;
        --bs-info: #58B4E5;
        --bs-warning: #F59E0B;
        --bs-danger: #F43F5E;

        --z-power: #58B4E5;
        --z-energy: #0284C7;
        --z-vitality: #10B981;
        --z-warmth: #C4952D;
        --z-coral: #F43F5E;
        --z-dark: #0F172A;

        /* Glass & Card Tokens */
        --z-glass-bg: rgba(255, 255, 255, 0.92);
        --z-glass-border: #E7EEF3;
        --z-glass-blur: 16px;
        --z-shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.03), 0 4px 12px rgba(15, 23, 42, 0.02);
        --z-shadow-md: 0 4px 20px rgba(15, 23, 42, 0.04), 0 8px 24px rgba(88, 180, 229, 0.06);
        --z-shadow-lg: 0 8px 30px rgba(15, 23, 42, 0.06), 0 16px 40px rgba(88, 180, 229, 0.08);
        --z-shadow-hover: 0 10px 25px rgba(88, 180, 229, 0.18), 0 4px 12px rgba(15, 23, 42, 0.04);
        --z-radius: 20px;
        --z-radius-sm: 12px;
        --z-radius-lg: 28px;

        --font-sans: "Alexandria", "Cairo", "Tajawal", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --font-en: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      body, html, * {
        font-family: var(--font-sans) !important;
      }

      html, body {
        background-color: var(--color-brand-bg) !important;
        color: var(--color-brand-text) !important;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* RTL Sidebar Navigation */
      [dir="rtl"] .codex-sidebar {
        width: 250px !important;
        right: 0 !important;
        left: auto !important;
        border-left: 1px solid #E7EEF3 !important;
        border-right: none !important;
        background: #FFFFFF !important;
        box-shadow: -4px 0 25px rgba(15, 23, 42, 0.03) !important;
        z-index: 100 !important;
        position: fixed !important;
        transition: width 0.22s cubic-bezier(0.4, 0, 0.2, 1) !important;
      }

      [dir="rtl"] .codex-sidebar .codex-brand {
        padding: 20px 18px 16px 18px !important;
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        justify-content: center !important;
        text-align: center !important;
        border-bottom: 1px solid #F1F5F9 !important;
      }

      [dir="rtl"] .codex-sidebar .codex-menu {
        padding: 16px 14px !important;
        list-style: none !important;
        margin: 0 !important;
        display: flex !important;
        flex-direction: column !important;
        gap: 6px !important;
      }

      [dir="rtl"] .themebody-wrap {
        position: fixed !important;
        top: 60px !important;
        bottom: 0 !important;
        left: 0 !important;
        right: 250px !important;
        margin: 0 !important;
        padding: 1.5rem 2rem 3rem 2rem !important;
        overflow-y: auto !important;
        overflow-x: hidden !important;
        direction: rtl !important;
        background: #FAFBFC !important;
        transition: right 0.22s cubic-bezier(0.4, 0, 0.2, 1) !important;
      }

      /* Header Glass Effect */
      [dir="rtl"] .codex-header {
        position: fixed !important;
        top: 0 !important;
        right: 250px !important;
        left: 0 !important;
        height: 60px !important;
        background: rgba(255, 255, 255, 0.9) !important;
        backdrop-filter: blur(16px) !important;
        -webkit-backdrop-filter: blur(16px) !important;
        border-bottom: 1px solid #E7EEF3 !important;
        z-index: 99 !important;
        display: flex !important;
        align-items: center !important;
        justify-content: space-between !important;
        padding: 0 1.5rem !important;
        transition: right 0.22s cubic-bezier(0.4, 0, 0.2, 1) !important;
      }

      /* Collapsed Sidebar Mode */
      [dir="rtl"] .sidebar-collapsed .codex-sidebar,
      [dir="rtl"] .codex-sidebar.collapsed {
        width: 76px !important;
      }
      [dir="rtl"] .sidebar-collapsed .codex-header {
        right: 76px !important;
      }
      [dir="rtl"] .sidebar-collapsed .themebody-wrap {
        right: 76px !important;
      }
      [dir="rtl"] .sidebar-collapsed .modal {
        right: 76px !important;
      }

      /* Universal Scrollbar */
      * {
        scrollbar-width: thin !important;
        scrollbar-color: rgba(203, 213, 225, 0.6) transparent !important;
      }
      ::-webkit-scrollbar {
        width: 6px !important;
        height: 6px !important;
      }
      ::-webkit-scrollbar-track {
        background: transparent !important;
      }
      ::-webkit-scrollbar-thumb {
        background: #CBD5E1 !important;
        border-radius: 10px !important;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94A3B8 !important;
      }

      /* Buttons & Controls */
      .btn-primary {
        background: linear-gradient(135deg, #58B4E5 0%, #38BDF8 100%) !important;
        border: none !important;
        color: #FFFFFF !important;
        border-radius: 50px !important;
        font-weight: 700 !important;
        box-shadow: 0 4px 15px rgba(88, 180, 229, 0.3) !important;
        transition: all 0.25s ease !important;
      }
      .btn-primary:hover, .btn-primary:focus, .btn-primary:active {
        background: linear-gradient(135deg, #48A4D5 0%, #0284C7 100%) !important;
        box-shadow: 0 6px 20px rgba(88, 180, 229, 0.45) !important;
        transform: translateY(-1px) !important;
        color: #FFFFFF !important;
      }

      .btn-outline-primary {
        color: #0284C7 !important;
        border: 1px solid #BAE6FD !important;
        background-color: #F0F9FF !important;
        border-radius: 50px !important;
        font-weight: 600 !important;
        transition: all 0.2s ease !important;
      }
      .btn-outline-primary:hover {
        background-color: #58B4E5 !important;
        border-color: #58B4E5 !important;
        color: #FFFFFF !important;
        box-shadow: 0 4px 12px rgba(88, 180, 229, 0.25) !important;
      }

      .bg-primary {
        background-color: #58B4E5 !important;
      }
      .text-primary {
        color: #0284C7 !important;
      }
      .border-primary {
        border-color: #58B4E5 !important;
      }
      .bg-primary-subtle {
        background-color: #E5F0FF !important;
        color: #0284C7 !important;
      }

      /* Modern Cards */
      .z-glass-card {
        background: var(--z-glass-bg) !important;
        backdrop-filter: blur(var(--z-glass-blur)) !important;
        -webkit-backdrop-filter: blur(var(--z-glass-blur)) !important;
        border: 1px solid var(--z-glass-border) !important;
        border-radius: var(--z-radius) !important;
        box-shadow: var(--z-shadow-sm) !important;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
      }
      .z-glass-card:hover {
        box-shadow: var(--z-shadow-hover) !important;
        transform: translateY(-2px) !important;
      }

      .z-premium-card {
        background: #FFFFFF !important;
        border: 1px solid #E7EEF3 !important;
        border-radius: var(--z-radius) !important;
        box-shadow: var(--z-shadow-md) !important;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
      }
      .z-premium-card:hover {
        box-shadow: var(--z-shadow-lg) !important;
        transform: translateY(-2px) !important;
      }

      /* Animated Entrance */
      @keyframes z-fadeInUp {
        from { opacity: 0; transform: translateY(14px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .z-animate-in {
        animation: z-fadeInUp 0.45s ease-out both;
      }

      /* Gradient Icon Backgrounds (Karim Zakaria Tone) */
      .z-icon-power {
        background: #E5F0FF !important;
        color: #0284C7 !important;
      }
      .z-icon-energy {
        background: #E0F2FE !important;
        color: #0369A1 !important;
      }
      .z-icon-vitality {
        background: #ECFDF5 !important;
        color: #059669 !important;
      }
      .z-icon-warmth {
        background: #FEF3C7 !important;
        color: #C4952D !important;
      }
      .z-icon-coral {
        background: #FFE4E6 !important;
        color: #E11D48 !important;
      }

      /* Tables */
      .z-table-premium tbody tr,
      .table tbody tr {
        transition: all 0.15s ease !important;
      }
      .z-table-premium tbody tr:hover,
      .table-hover > tbody > tr:hover {
        background: #F8FAFC !important;
      }

      [dir="rtl"] .table tbody tr td:first-child {
        border-right: 3px solid transparent !important;
        transition: border-color 0.15s ease-in-out !important;
      }
      [dir="rtl"] .table tbody tr:hover td:first-child {
        border-right-color: #58B4E5 !important;
      }

      /* Form controls */
      .form-control, .form-select {
        border-radius: 12px !important;
        border-color: #E2E8F0 !important;
        font-family: var(--font-sans) !important;
      }
      .form-control:focus, .form-select:focus {
        border-color: #58B4E5 !important;
        box-shadow: 0 0 0 3px rgba(88, 180, 229, 0.18) !important;
      }

      /* Print media */
      @media print {
        .z-glass-card, .z-premium-card {
          backdrop-filter: none !important;
          -webkit-backdrop-filter: none !important;
          box-shadow: none !important;
          animation: none !important;
          transform: none !important;
          background: #FFFFFF !important;
        }
        .z-animate-in {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body data-bs-theme="light" data-sidebar-theme="light" data-bs-sidebar="full">
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister();
            console.log('ServiceWorker unregistered');
          }
        });
      }
      
      window.addEventListener('error', function(e) {
        var errDiv = document.createElement('div');
        errDiv.style.position = 'fixed';
        errDiv.style.top = '0';
        errDiv.style.left = '0';
        errDiv.style.width = '100vw';
        errDiv.style.height = '100vh';
        errDiv.style.backgroundColor = 'rgba(255,0,0,0.9)';
        errDiv.style.color = 'white';
        errDiv.style.zIndex = '999999';
        errDiv.style.padding = '20px';
        errDiv.style.fontSize = '24px';
        errDiv.style.whiteSpace = 'pre-wrap';
        errDiv.innerHTML = '<h1>Javascript Error:</h1><p>' + e.message + '</p><p>' + e.filename + ':' + e.lineno + '</p>';
        document.body.appendChild(errDiv);
      });
      window.addEventListener('unhandledrejection', function(e) {
        var errDiv = document.createElement('div');
        errDiv.style.position = 'fixed';
        errDiv.style.top = '0';
        errDiv.style.left = '0';
        errDiv.style.width = '100vw';
        errDiv.style.height = '100vh';
        errDiv.style.backgroundColor = 'rgba(255,0,0,0.9)';
        errDiv.style.color = 'white';
        errDiv.style.zIndex = '999999';
        errDiv.style.padding = '20px';
        errDiv.style.fontSize = '24px';
        errDiv.style.whiteSpace = 'pre-wrap';
        errDiv.innerHTML = '<h1>Promise Rejection:</h1><p>' + e.reason + '</p>';
        document.body.appendChild(errDiv);
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
