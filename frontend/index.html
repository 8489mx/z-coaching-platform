        background-size: 200% auto !important;
        color: #ffffff !important;
        border: none !important;
        border-radius: 50px !important;
        font-weight: 700 !important;
        box-shadow: 0 4px 15px rgba(38, 28, 106, 0.3) !important;
        transition: all 0.3s ease !important;
      }
      .z-btn-premium:hover {
        background-position: right center !important;
        box-shadow: 0 6px 20px rgba(38, 28, 106, 0.4) !important;
        transform: translateY(-1px) !important;
        color: #ffffff !important;
      }

      /* Premium Badge Glow */
      .z-badge-glow {
        animation: z-pulse-soft 2.5s ease-in-out infinite;
      }

      /* Sidebar Premium Gradient */
      .z-sidebar-premium {
        background: linear-gradient(180deg, #ffffff 0%, #faf8ff 40%, #f5f0ff 100%) !important;
        border-left: 1px solid rgba(221, 214, 254, 0.4) !important;
      }

      /* Header Glass Effect */
      [dir="rtl"] .codex-header {
        background: rgba(255, 255, 255, 0.85) !important;
        backdrop-filter: blur(12px) !important;
        -webkit-backdrop-filter: blur(12px) !important;
        border-bottom: 1px solid rgba(226, 232, 240, 0.5) !important;
      }

      /* Table Premium Hover */
      .z-table-premium tbody tr {
        transition: all 0.2s ease !important;
      }
      .z-table-premium tbody tr:hover {
        background: linear-gradient(90deg, rgba(245, 243, 255, 0.5) 0%, rgba(255,255,255,0.8) 100%) !important;
        transform: scale(1.002) !important;
      }

      /* Smooth scrollbar with brand color on hover */
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(38, 28, 106, 0.3) !important;
      }

      /* Print media — disable all animations and glass effects for PDF */
      @media print {
        .z-glass-card, .z-premium-card {
          backdrop-filter: none !important;
          -webkit-backdrop-filter: none !important;
          box-shadow: none !important;
          animation: none !important;
          transform: none !important;
        }
        .z-animate-in {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body data-bs-theme="light" data-sidebar-theme="light" data-bs-sidebar="full">
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister();
            console.log('ServiceWorker unregistered');
          }
        });
      }
      
      window.addEventListener('error', function(e) {
        var errDiv = document.createElement('div');
        errDiv.style.position = 'fixed';
        errDiv.style.top = '0';
        errDiv.style.left = '0';
        errDiv.style.width = '100vw';
        errDiv.style.height = '100vh';
        errDiv.style.backgroundColor = 'rgba(255,0,0,0.9)';
        errDiv.style.color = 'white';
        errDiv.style.zIndex = '999999';
        errDiv.style.padding = '20px';
        errDiv.style.fontSize = '24px';
        errDiv.style.whiteSpace = 'pre-wrap';
        errDiv.innerHTML = '<h1>Javascript Error:</h1><p>' + e.message + '</p><p>' + e.filename + ':' + e.lineno + '</p>';
        document.body.appendChild(errDiv);
      });
      window.addEventListener('unhandledrejection', function(e) {
        var errDiv = document.createElement('div');
        errDiv.style.position = 'fixed';
        errDiv.style.top = '0';
        errDiv.style.left = '0';
        errDiv.style.width = '100vw';
        errDiv.style.height = '100vh';
        errDiv.style.backgroundColor = 'rgba(255,0,0,0.9)';
        errDiv.style.color = 'white';
        errDiv.style.zIndex = '999999';
        errDiv.style.padding = '20px';
        errDiv.style.fontSize = '24px';
        errDiv.style.whiteSpace = 'pre-wrap';
        errDiv.innerHTML = '<h1>Promise Rejection:</h1><p>' + e.reason + '</p>';
        document.body.appendChild(errDiv);
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
