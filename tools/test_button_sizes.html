<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Button Size Comparison</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    * { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    
    /* 34px Current */
    .pill-34 {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      height: 34px; padding: 0 13px; border-radius: 9999px; font-size: 13px; font-weight: 600;
      color: #284C7C; background-color: #F8FBFF; border: 1px solid #D9E7F5;
    }
    
    /* 28px Compact */
    .pill-28 {
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
      height: 28px; padding: 0 11px; border-radius: 9999px; font-size: 11.5px; font-weight: 600;
      color: #284C7C; background-color: #F8FBFF; border: 1px solid #D9E7F5;
    }

    /* 26px Micro (Recommended) */
    .pill-26 {
      display: inline-flex; align-items: center; justify-content: center; gap: 4px;
      height: 26px; padding: 0 10px; border-radius: 9999px; font-size: 11px; font-weight: 600;
      color: #284C7C; background-color: #F8FBFF; border: 1px solid #D9E7F5;
    }

    /* 24px Ultra-Compact */
    .pill-24 {
      display: inline-flex; align-items: center; justify-content: center; gap: 4px;
      height: 24px; padding: 0 9px; border-radius: 9999px; font-size: 10.5px; font-weight: 600;
      color: #284C7C; background-color: #F8FBFF; border: 1px solid #D9E7F5;
    }
  </style>
</head>
<body class="bg-slate-100 p-8 flex flex-col items-center gap-6">

  <div class="w-[360px] bg-white rounded-[20px] p-4 shadow-sm space-y-4">
    <div class="text-xs font-bold text-slate-400">الحالي (34px) - كبير جداً:</div>
    <div class="flex items-center justify-between">
      <span class="text-[13px] font-bold text-[#0F172A]">التغذية</span>
      <button class="pill-34">
        <span>عرض الوجبات</span>
        <svg class="w-3.5 h-3.5 rtl:rotate-180" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>
  </div>

  <div class="w-[360px] bg-white rounded-[20px] p-4 shadow-sm space-y-4">
    <div class="text-xs font-bold text-sky-600">المقترح الموصى به (26px) - متناسق وناعم:</div>
    <div class="flex items-center justify-between">
      <span class="text-[13px] font-bold text-[#0F172A]">التغذية</span>
      <button class="pill-26">
        <span>عرض الوجبات</span>
        <svg class="w-3 h-3 rtl:rotate-180" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>
  </div>

  <div class="w-[360px] bg-white rounded-[20px] p-4 shadow-sm space-y-4">
    <div class="text-xs font-bold text-slate-600">مقترح (28px):</div>
    <div class="flex items-center justify-between">
      <span class="text-[13px] font-bold text-[#0F172A]">التغذية</span>
      <button class="pill-28">
        <span>عرض الوجبات</span>
        <svg class="w-3 h-3 rtl:rotate-180" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>
  </div>

  <div class="w-[360px] bg-white rounded-[20px] p-4 shadow-sm space-y-4">
    <div class="text-xs font-bold text-slate-600">مقترح (24px) - دقيق ومدمج:</div>
    <div class="flex items-center justify-between">
      <span class="text-[13px] font-bold text-[#0F172A]">التغذية</span>
      <button class="pill-24">
        <span>عرض الوجبات</span>
        <svg class="w-2.5 h-2.5 rtl:rotate-180" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>
  </div>

</body>
</html>
